[project]
name = "llm-benchmark"
version = "0.1.0"
description = "PR-Review Benchmark comparing gito.bot, pr-agent (both on local Qwen) vs. CodeRabbit baseline"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "pydantic>=2.6",
    "httpx>=0.27",
    "anthropic>=0.34",
    "openai>=1.40",
    "rich>=13.7",
    "psycopg[binary]>=3.2",
    "boto3>=1.34",
]

[project.scripts]
benchmark = "benchmark.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-mock>=3.12",
    "ruff>=0.5",
]

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/benchmark"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: tests hitting real external endpoints (opt-in, not CI default)",
    "db: tests requiring the local docker-compose Postgres/MinIO stack (opt-in, not CI default)",
]
addopts = "-m 'not live and not db'"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501", "SIM117"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["E731"]  # lambdas as prompt stubs are idiomatic in tests
