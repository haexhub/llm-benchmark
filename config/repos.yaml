# Liste der zu benchmarkenden Repositories und PRs.
# Jedes Repo listet die konkreten PR-Nummern die von CodeRabbit reviewed wurden.
#
# repos:
#   - owner: your-user
#     name: sample-repo
#     pr_numbers: [42, 43, 47]

repos:
  - owner: haexmas
    name: holzi
    pr_numbers: [27]

# Dauerhafte, private Shadow-Reviews. Die Legacy-PR-Liste oben bleibt nur für
# manuelle Diagnose-Runs; diese explizite Liste steuert GitHub-Event-Intake.
live_repositories:
  - owner: haexmas
    name: holzi
    enabled: true
    baseline_wait_minutes: 30
